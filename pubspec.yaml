name: bungtemin_flutter
description: "Bungtemin Mobile (PUK SP LEM SPSI PT. TMMIN) built with Flutter."
publish_to: 'none'
version: 10.1.7+67

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.3
  flutter_widget_from_html_core: ^0.15.2
  http: ^1.2.2
  shared_preferences: ^2.3.3
  sqflite: ^2.4.1
  path: ^1.9.0
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0
  encrypt: ^5.0.3
  url_launcher: ^6.3.1
  app_links: ^6.4.0
  video_player: ^2.9.2
  youtube_player_iframe: ^6.0.3
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  flutter_local_notifications: ^23.0.2
  web_socket_channel: ^3.0.3
  nfc_manager: ^3.5.0
  package_info_plus: '>=8.0.0 <11.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/img/appicon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#070D1B"
  adaptive_icon_foreground: "assets/img/appicon.png"
  adaptive_icon_foreground_inset: 8

flutter:
  uses-material-design: true
  assets:
    - assets/card/
    - assets/doc/
    - assets/hd/
    - assets/icon/
    - assets/img/
